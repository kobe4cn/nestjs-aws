name: NestJS CI/CD (UAT)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pipeline_action:
        description: "选择流水线动作 (deploy: 发布代码 | init: 创建 UAT 资源并发布 | destroy: 销毁全部 UAT 计费资源)"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - init
          - destroy

permissions:
  contents: read

jobs:
  test:
    name: CI - Build & Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.pipeline_action != 'destroy' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build auth
        run: pnpm exec nest build auth

      - name: Build order
        run: pnpm exec nest build order

      - name: Unit tests
        run: pnpm test --runInBand

  deploy-uat:
    name: CD - AWS CodeBuild & UAT Deploy
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.pipeline_action == 'destroy')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Trigger AWS CodeBuild & Stream Logs
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: |
          chmod +x ./scripts/setup-aws-codebuild.sh
          ./scripts/setup-aws-codebuild.sh start "${{ inputs.pipeline_action || 'deploy' }}" "${{ github.sha }}"
