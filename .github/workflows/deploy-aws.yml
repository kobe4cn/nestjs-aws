name: Deploy Auth & Order to AWS ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      network_mode:
        description: '网络出网模式 (DISABLED=私有子网+NAT网关, ENABLED=公有子网免NAT网关)'
        required: true
        default: 'DISABLED'
        type: choice
        options:
          - DISABLED
          - ENABLED

env:
  AWS_REGION: ap-southeast-1
  AUTH_REPO: nestjs-auth
  ORDER_REPO: nestjs-order
  ECS_CLUSTER: nestjs-prod-cluster
  AUTH_SERVICE: auth-service
  ORDER_SERVICE: order-service
  MIGRATION_TASK_DEF: nestjs-auth-task

jobs:
  deploy:
    name: Build, Migrate RDS & Deploy to ECS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 推荐使用 AWS OIDC 角色认证；若使用 IAM User AK/SK，可替换为 aws-access-key-id / aws-secret-access-key
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push auth & order Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/arm64 \
            --build-arg APP_NAME=auth \
            -t ${ECR_REGISTRY}/${AUTH_REPO}:${IMAGE_TAG} \
            -t ${ECR_REGISTRY}/${AUTH_REPO}:latest \
            .
          docker push ${ECR_REGISTRY}/${AUTH_REPO}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${AUTH_REPO}:latest

          docker build \
            --platform linux/arm64 \
            --build-arg APP_NAME=order \
            -t ${ECR_REGISTRY}/${ORDER_REPO}:${IMAGE_TAG} \
            -t ${ECR_REGISTRY}/${ORDER_REPO}:latest \
            .
          docker push ${ECR_REGISTRY}/${ORDER_REPO}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ORDER_REPO}:latest

      - name: Run RDS TypeORM Migration via ECS One-off Task
        env:
          SUBNET_IDS: ${{ secrets.ECS_SUBNET_IDS }}
          AUTH_SG_ID: ${{ secrets.ECS_AUTH_SG_ID }}
          ASSIGN_PUBLIC_IP: ${{ github.event.inputs.network_mode || 'DISABLED' }}
        run: |
          chmod +x ./scripts/deploy-aws.sh
          ./scripts/deploy-aws.sh migrate

      - name: Deploy order & auth services to Amazon ECS
        run: |
          ./scripts/deploy-aws.sh rollout

