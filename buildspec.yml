version: 0.2

# ==============================================================================
# AWS CodeBuild 全自动 CI/CD 与 UAT 环境编排规范 (ARM64 原生环境 - 支持 CodePipeline)
#
# 配合 AWS CodePipeline 三阶段可视化流水线：
#   - Stage 1 (Source) : 拉取最新 GitHub 代码包
#   - Stage 2 (Build)  : 编译单测 -> 创建/推送 ECR 镜像 -> 检查/拉起 UAT 基础设施
#                        -> 执行 RDS 数据库 Migration -> 生成 imagedefinitions-*.json
#   - Stage 3 (Deploy) : 由 CodePipeline 原生 Amazon ECS 部署器读取 imagedefinitions-*.json，
#                        并行滚动部署 order-service 与 auth-service 并可视化追踪进度
# ==============================================================================

env:
  variables:
    AWS_DEFAULT_REGION: "ap-southeast-2"
    PIPELINE_ACTION: "deploy"
    AUTH_REPO: "nestjs-auth"
    ORDER_REPO: "nestjs-order"
    ECS_CLUSTER: "nestjs-prod-cluster"
    AUTH_SERVICE: "auth-service"
    ORDER_SERVICE: "order-service"
    MIGRATION_TASK_DEF: "nestjs-auth-task"

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - |
        set -e
        echo "==> [Install] 当前流水线模式: PIPELINE_ACTION=${PIPELINE_ACTION}, Initiator=${CODEBUILD_INITIATOR:-standalone}"
        if [ "${PIPELINE_ACTION}" = "destroy" ]; then
          echo "ℹ️ 当前为销毁模式 (destroy)，跳过 Node.js 依赖安装。"
          exit 0
        fi
        echo "==> [Install] 配置 Node.js 与 pnpm 环境..."
        node -v
        corepack enable || npm install -g pnpm@10
        corepack prepare pnpm@10 --activate || true
        pnpm -v
        echo "==> [Install] 安装项目锁定依赖..."
        pnpm install --frozen-lockfile

  pre_build:
    commands:
      - |
        set -e
        if [ "${PIPELINE_ACTION}" = "destroy" ]; then
          exit 0
        fi

        echo "==> [CI 1/3] 编译 auth 微服务..."
        pnpm exec nest build auth
        echo "==> [CI 2/3] 编译 order 微服务..."
        pnpm exec nest build order
        echo "==> [CI 3/3] 执行单元测试..."
        pnpm test --runInBand

        echo "==> [ECR] 检查并自动创建 ECR 镜像仓库 (${AUTH_REPO} & ${ORDER_REPO})..."
        for repo in "${AUTH_REPO}" "${ORDER_REPO}"; do
          if ! aws ecr describe-repositories --repository-names "${repo}" --region "${AWS_DEFAULT_REGION}" >/dev/null 2>&1; then
            echo "    创建 ECR 仓库: ${repo}..."
            aws ecr create-repository --repository-name "${repo}" --region "${AWS_DEFAULT_REGION}" >/dev/null
          else
            echo "    ECR 仓库已存在: ${repo}"
          fi
        done

  build:
    commands:
      - |
        set -e
        if [ "${PIPELINE_ACTION}" = "destroy" ]; then
          echo "==> [Infra Destroy] 开始全量销毁 AWS UAT 基础设施与计费资源..."
          chmod +x ./scripts/destroy-aws-infra.sh
          AWS_REGION="${AWS_DEFAULT_REGION}" bash ./scripts/destroy-aws-infra.sh
          echo "[]" > imagedefinitions-order.json
          echo "[]" > imagedefinitions-auth.json
          exit 0
        fi

        export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        if [ -f ".git_commit_sha" ]; then
          export IMAGE_TAG=$(cat .git_commit_sha | cut -c 1-7)
        else
          export IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}" | cut -c 1-7)
        fi
        echo "ECR Registry: ${ECR_REGISTRY}, Image Tag: ${IMAGE_TAG}"

        echo "==> [Build 1/3] 构建 auth 生产容器镜像 (linux/arm64)..."
        docker build --build-arg APP_NAME=auth -t "${ECR_REGISTRY}/${AUTH_REPO}:${IMAGE_TAG}" -t "${ECR_REGISTRY}/${AUTH_REPO}:latest" .

        echo "==> [Build 2/3] 构建 order 生产容器镜像 (linux/arm64)..."
        docker build --build-arg APP_NAME=order -t "${ECR_REGISTRY}/${ORDER_REPO}:${IMAGE_TAG}" -t "${ECR_REGISTRY}/${ORDER_REPO}:latest" .

        echo "==> [Build 3/3] 登录 AWS ECR 并推送双服务镜像..."
        aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
        docker push "${ECR_REGISTRY}/${AUTH_REPO}:${IMAGE_TAG}"
        docker push "${ECR_REGISTRY}/${AUTH_REPO}:latest"
        docker push "${ECR_REGISTRY}/${ORDER_REPO}:${IMAGE_TAG}"
        docker push "${ECR_REGISTRY}/${ORDER_REPO}:latest"
        echo "✅ 镜像推送 ECR 完成！"

        # 生成供 AWS CodePipeline Stage 3 (Amazon ECS Deploy) 消费的标准镜像定义工件
        printf '[{"name":"order","imageUri":"%s/%s:%s"}]\n' "${ECR_REGISTRY}" "${ORDER_REPO}" "${IMAGE_TAG}" > imagedefinitions-order.json
        printf '[{"name":"auth","imageUri":"%s/%s:%s"}]\n' "${ECR_REGISTRY}" "${AUTH_REPO}" "${IMAGE_TAG}" > imagedefinitions-auth.json
        cat imagedefinitions-order.json
        cat imagedefinitions-auth.json

  post_build:
    commands:
      - |
        set -e
        if [ "${CODEBUILD_BUILD_SUCCEEDING}" != "1" ]; then
          echo "❌ 构建阶段未通过，中止后续部署流程。"
          exit 1
        fi

        if [ "${PIPELINE_ACTION}" = "destroy" ]; then
          echo "✅ UAT 环境销毁流程执行完毕！"
          exit 0
        fi

        echo "==> [CD 1/3] 自动检查并编排 AWS UAT 基础设施 (VPC / SG / KMS / Secrets / RDS / Redis / ALB / ECS)..."
        chmod +x ./scripts/init-aws-infra.sh
        AUTO_DEPLOY=false AWS_REGION="${AWS_DEFAULT_REGION}" bash ./scripts/init-aws-infra.sh

        echo "==> [CD 2/3] 执行 RDS 数据库 TypeORM Migration..."
        AUTH_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=ecs-auth-sg" --region "${AWS_DEFAULT_REGION}" --query "SecurityGroups[0].GroupId" --output text)
        VPC_ID=$(aws ec2 describe-security-groups --group-ids "${AUTH_SG_ID}" --region "${AWS_DEFAULT_REGION}" --query "SecurityGroups[0].VpcId" --output text)
        SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=${VPC_ID}" --region "${AWS_DEFAULT_REGION}" --query "Subnets[0:2].SubnetId" --output text | tr '\t' ',')

        echo "启动 ECS 一次性数据库迁移任务 (${MIGRATION_TASK_DEF}, Subnets: ${SUBNET_IDS}, SG: ${AUTH_SG_ID})..."
        TASK_ARN=$(aws ecs run-task \
          --cluster "${ECS_CLUSTER}" \
          --task-definition "${MIGRATION_TASK_DEF}" \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[${SUBNET_IDS}],securityGroups=[${AUTH_SG_ID}],assignPublicIp=ENABLED}" \
          --overrides '{"containerOverrides":[{"name":"auth","command":["node","./node_modules/typeorm/cli.js","migration:run","-d","dist/apps/auth/lib/common/database/data-source.js"]}]}' \
          --region "${AWS_DEFAULT_REGION}" \
          --query 'tasks[0].taskArn' \
          --output text)
        echo "等待迁移任务执行完成 (${TASK_ARN})..."
        aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" --region "${AWS_DEFAULT_REGION}"
        EXIT_CODE=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" --region "${AWS_DEFAULT_REGION}" --query 'tasks[0].containers[0].exitCode' --output text)
        if [ "${EXIT_CODE}" != "0" ]; then
          echo "❌ 数据库 Migration 失败，容器退出码: ${EXIT_CODE}"
          exit 1
        fi
        echo "✅ 数据库 Migration 执行成功！"

        ALB_DNS=$(aws elbv2 describe-load-balancers --names "nestjs-alb" --region "${AWS_DEFAULT_REGION}" --query "LoadBalancers[0].DNSName" --output text 2>/dev/null || echo "")

        # 若由 AWS CodePipeline 触发，ECS 服务滚动更新交由 CodePipeline 的 Stage 3 (Deploy) 可视化阶段执行
        if [[ "${CODEBUILD_INITIATOR:-}" == codepipeline/* ]]; then
          echo "==> [CD 3/3] 检测到由 AWS CodePipeline 驱动，已生成 imagedefinitions 工件，即将进入 CodePipeline Stage 3 (Deploy to ECS) 可视化部署阶段！"
          echo "🌐 UAT 环境访问地址: http://${ALB_DNS}"
          exit 0
        fi

        echo "==> [CD 3/3] 触发 ECS 服务滚动更新 (${ORDER_SERVICE} & ${AUTH_SERVICE})..."
        aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${ORDER_SERVICE}" --force-new-deployment --region "${AWS_DEFAULT_REGION}" >/dev/null
        aws ecs update-service --cluster "${ECS_CLUSTER}" --service "${AUTH_SERVICE}" --force-new-deployment --region "${AWS_DEFAULT_REGION}" >/dev/null
        echo "等待服务滚动更新达到稳定状态..."
        aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${ORDER_SERVICE}" "${AUTH_SERVICE}" --region "${AWS_DEFAULT_REGION}"

        echo "=============================================================================="
        echo "🎉 CodeBuild CI/CD 全流程构建与 UAT 部署完成！"
        if [ -n "${ALB_DNS}" ] && [ "${ALB_DNS}" != "None" ]; then
          echo "🌐 UAT 环境访问地址: http://${ALB_DNS}"
          echo "🩺 健康检查接口:     http://${ALB_DNS}/api/v1/health"
        fi
        echo "=============================================================================="

artifacts:
  files:
    - imagedefinitions-order.json
    - imagedefinitions-auth.json

cache:
  paths:
    - "/root/.local/share/pnpm/store/**/*"
